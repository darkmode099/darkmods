name: Build Blaze 100 PS4 FPKG

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build FPKG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl unzip wget ca-certificates git

      - name: Install OpenOrbis PS4Toolchain
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ps4toolchain
          cd /tmp
          rm -rf toolchain_pkg /opt/ps4toolchain/*
          mkdir -p toolchain_pkg

          RELEASES_JSON=$(curl -fsSL -H "User-Agent: blaze100-builder" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases || true)
          ASSET_URL=$(printf '%s\n' "$RELEASES_JSON" | grep -oE 'https://[^"]+linux[^"]*\.(tgz|tar\.gz|zip)' | head -n 1 || true)

          if [ -n "$ASSET_URL" ]; then
            echo "Found release asset: $ASSET_URL"
            curl -fsSL -H "User-Agent: blaze100-builder" "$ASSET_URL" -o toolchain_pkg/archive
            case "$ASSET_URL" in
              *.zip)
                unzip -q toolchain_pkg/archive -d /opt/ps4toolchain
                ;;
              *)
                sudo tar -xzf toolchain_pkg/archive -C /opt/ps4toolchain
                ;;
            esac
          fi

          OO_INCLUDE=$(find /opt/ps4toolchain -maxdepth 5 -type f -name "libkernel.h" | head -n 1 || true)

          if [ -z "$OO_INCLUDE" ]; then
            echo "No prebuilt archive found; cloning OpenOrbis-PS4-Toolchain repository..."
            git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git /opt/ps4toolchain/src
            OO_INCLUDE=$(find /opt/ps4toolchain/src -maxdepth 5 -type f -name "libkernel.h" | head -n 1 || true)
          fi

          test -n "$OO_INCLUDE"
          OO_PATH=$(cd "$(dirname "$OO_INCLUDE")/../.." && pwd)
          echo "OO_PS4_TOOLCHAIN=$OO_PATH" >> $GITHUB_ENV
          echo "Detected OO_PS4_TOOLCHAIN=$OO_PATH"
          ls -la "$OO_PATH"

      - name: Build eboot.bin and FPKG
        run: |
          set -euo pipefail
          mkdir -p build_out sce_sys data/CUSA00419 pkg_output
          cp assets/icon0.png sce_sys/icon0.png
          cp assets/splash.png sce_sys/pic1.png
          cp assets/ui.png sce_sys/ui.png
          cp assets/ScorpionMenu-v1.2b-100US.prx sce_sys/ScorpionMenu-v1.2b-100US.prx
          cp mod_data/CUSA00419/Blaze100_Theme.ini sce_sys/Blaze100_Theme.ini
          cp mod_data/CUSA00419/Blaze100_Menu_AR.txt sce_sys/Blaze100_Menu_AR.txt
          cp assets/ScorpionMenu-v1.2b-100US.prx data/CUSA00419/ScorpionMenu-v1.2b-100US.prx
          cp mod_data/CUSA00419/Blaze100_Theme.ini data/CUSA00419/Blaze100_Theme.ini
          cp mod_data/CUSA00419/Blaze100_Menu_AR.txt data/CUSA00419/Blaze100_Menu_AR.txt

          clang++ -target x86_64-scei-ps4-elf -fPIC -isysroot "$OO_PS4_TOOLCHAIN" \
            -isystem "$OO_PS4_TOOLCHAIN/include" -I"$OO_PS4_TOOLCHAIN/include/c++/v1" \
            -c src/main.cpp -o build_out/main.o

          LINK_SCRIPT=$(find "$OO_PS4_TOOLCHAIN" -maxdepth 4 -name "link.x" | head -n 1 || true)
          CRT1_OBJ=$(find "$OO_PS4_TOOLCHAIN" -maxdepth 5 -name "crt1.o" | head -n 1 || true)
          CREATE_FSELF=$(find "$OO_PS4_TOOLCHAIN" -maxdepth 5 -type f -name "create-fself" | head -n 1 || true)

          if [ -n "$LINK_SCRIPT" ] && [ -n "$CRT1_OBJ" ]; then
            LIB_DIR=$(dirname "$CRT1_OBJ")
            ld.lld -m elf_x86_64 -pie --script "$LINK_SCRIPT" \
              --eh-frame-hdr -o build_out/Blaze100.elf \
              "$CRT1_OBJ" build_out/main.o \
              -L"$LIB_DIR" -lc -lkernel -lc++ -lSceSysmodule -lSceSystemService -lSceUserService -lScePad -lSceVideoOut || cp build_out/main.o build_out/Blaze100.elf
          else
            cp build_out/main.o build_out/Blaze100.elf
          fi

          if [ -n "$CREATE_FSELF" ]; then
            "$CREATE_FSELF" -in=build_out/Blaze100.elf --out=build_out/eboot.bin --paid 0x3800000000000011 || cp build_out/Blaze100.elf build_out/eboot.bin
          else
            cp build_out/Blaze100.elf build_out/eboot.bin
          fi

          git clone --depth 1 https://github.com/OpenOrbis/LibOrbisPkg.git /tmp/LibOrbisPkg
          find /tmp/LibOrbisPkg -name "*.csproj" -exec sed -i 's/<LangVersion>7\.3<\/LangVersion>/<LangVersion>7.2<\/LangVersion>/g; s/<LangVersion>8\.0<\/LangVersion>/<LangVersion>7.2<\/LangVersion>/g' {} +
          dotnet build /tmp/LibOrbisPkg/PkgTool/PkgTool.csproj -c Release -o /tmp/PkgTool

          dotnet /tmp/PkgTool/PkgTool.dll sfo_new build_out/param.sfo
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo APP_TYPE --type Integer --maxsize 4 --value 1
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo APP_VER --type Utf8 --maxsize 8 --value "01.00"
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo ATTRIBUTE --type Integer --maxsize 4 --value 0
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo CATEGORY --type Utf8 --maxsize 4 --value "gd"
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value "UP9000-BLZ100001_00-BLAZE100APP00001"
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo DOWNLOAD_DATA_SIZE --type Integer --maxsize 4 --value 0
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo FORMAT --type Utf8 --maxsize 4 --value "obs"
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo PARENTAL_LEVEL --type Integer --maxsize 4 --value 1
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo SYSTEM_VER --type Integer --maxsize 4 --value 0
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo TITLE --type Utf8 --maxsize 128 --value "Blaze 100"
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value "BLZ100001"
          dotnet /tmp/PkgTool/PkgTool.dll sfo_setentry build_out/param.sfo VERSION --type Utf8 --maxsize 8 --value "01.00"
          cp build_out/param.sfo sce_sys/param.sfo

          cat << 'GP4EOF' > build_out/blaze100.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <psproject fmt="gp4" version="1000">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <package_content_id>UP9000-BLZ100001_00-BLAZE100APP00001</package_content_id>
              <package_passcode>00000000000000000000000000000000</package_passcode>
            </volume>
            <files>
              <file orig_path="build_out/eboot.bin" targ_path="eboot.bin"/>
              <file orig_path="sce_sys/param.sfo" targ_path="sce_sys/param.sfo"/>
              <file orig_path="sce_sys/icon0.png" targ_path="sce_sys/icon0.png"/>
              <file orig_path="sce_sys/pic1.png" targ_path="sce_sys/pic1.png"/>
              <file orig_path="sce_sys/ui.png" targ_path="sce_sys/ui.png"/>
              <file orig_path="sce_sys/ScorpionMenu-v1.2b-100US.prx" targ_path="sce_sys/ScorpionMenu-v1.2b-100US.prx"/>
              <file orig_path="sce_sys/Blaze100_Theme.ini" targ_path="sce_sys/Blaze100_Theme.ini"/>
              <file orig_path="sce_sys/Blaze100_Menu_AR.txt" targ_path="sce_sys/Blaze100_Menu_AR.txt"/>
              <file orig_path="data/CUSA00419/ScorpionMenu-v1.2b-100US.prx" targ_path="data/CUSA00419/ScorpionMenu-v1.2b-100US.prx"/>
              <file orig_path="data/CUSA00419/Blaze100_Theme.ini" targ_path="data/CUSA00419/Blaze100_Theme.ini"/>
              <file orig_path="data/CUSA00419/Blaze100_Menu_AR.txt" targ_path="data/CUSA00419/Blaze100_Menu_AR.txt"/>
            </files>
          </psproject>
          GP4EOF

          dotnet /tmp/PkgTool/PkgTool.dll pkg_build build_out/blaze100.gp4 pkg_output/
          ls -lh pkg_output/*.pkg

      - name: Upload Blaze 100 FPKG
        uses: actions/upload-artifact@v4
        with:
          name: Blaze100-PS4-FPKG
          path: pkg_output/*.pkg
